<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mistral Chat</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f6f6f8;
        color: #1a1a1a;
        display: flex;
        justify-content: center;
      }
      main {
        width: 100%;
        max-width: 720px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 16px;
      }
      h1 {
        font-size: 1.1rem;
        margin: 8px 0 16px;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        background: #fff;
        border: 1px solid #e2e2e6;
        border-radius: 8px;
      }
      .msg {
        max-width: 80%;
        padding: 8px 12px;
        border-radius: 12px;
        white-space: pre-wrap;
        line-height: 1.4;
      }
      .msg.user {
        align-self: flex-end;
        background: #4f46e5;
        color: #fff;
      }
      .msg.assistant {
        align-self: flex-start;
        background: #eeeef2;
      }
      .msg.error {
        align-self: flex-start;
        background: #fde8e8;
        color: #b91c1c;
      }
      form {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      input {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #d4d4d8;
        border-radius: 8px;
        font-size: 1rem;
      }
      button {
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mistral Chat (mistral-small-latest)</h1>
      <div id="messages"></div>
      <form id="composer">
        <input id="input" type="text" placeholder="Type a message..." autocomplete="off" required />
        <button id="send" type="submit">Send</button>
      </form>
    </main>
    <script>
      const messagesEl = document.getElementById('messages');
      const form = document.getElementById('composer');
      const input = document.getElementById('input');
      const sendBtn = document.getElementById('send');

      const history = [];

      function addMessage(role, content, isError = false) {
        const div = document.createElement('div');
        div.className = 'msg ' + (isError ? 'error' : role);
        div.textContent = content;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        sendBtn.disabled = true;
        addMessage('user', text);
        history.push({ role: 'user', content: text });

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: history }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Request failed');
          addMessage('assistant', data.content);
          history.push({ role: 'assistant', content: data.content });
        } catch (err) {
          addMessage('error', err.message, true);
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
