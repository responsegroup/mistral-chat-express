name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test server boot
        run: |
          PORT=3123 node dist/server.js &
          sleep 2
          node --input-type=module -e "const r = await fetch('http://localhost:3123/'); if (r.status !== 200) throw new Error('UI not served'); console.log('smoke ok');"
